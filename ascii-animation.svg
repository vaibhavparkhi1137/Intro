<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Animated ASCII terminal with a floating Salesforce cloud">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#032d60"/>
    </linearGradient>
    <clipPath id="c1"><rect x="410" y="86" height="24" width="0"><animate attributeName="width" values="0;0;198;198;0" keyTimes="0;0.03;0.14;0.95;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="410" y="116" height="24" width="0"><animate attributeName="width" values="0;0;189;189;0" keyTimes="0;0.20;0.31;0.95;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="410" y="146" height="24" width="0"><animate attributeName="width" values="0;0;270;270;0" keyTimes="0;0.37;0.50;0.95;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="410" y="176" height="24" width="0"><animate attributeName="width" values="0;0;243;243;0" keyTimes="0;0.54;0.66;0.95;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="410" y="206" height="24" width="0"><animate attributeName="width" values="0;0;333;333;0" keyTimes="0;0.71;0.86;0.95;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="2" y="2" width="816" height="296" rx="14" fill="url(#bg)" stroke="#00a1e0" stroke-width="2"/>
  <rect x="2" y="2" width="816" height="36" rx="14" fill="#001e3c"/>
  <rect x="2" y="24" width="816" height="14" fill="#001e3c"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="410" y="25" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8fb8d9">vaibhav@salesforce:~</text>

  <!-- twinkling stars -->
  <g font-family="Courier New, monospace" font-size="16" fill="#7fd4ff">
    <text x="60" y="80">*<animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite"/></text>
    <text x="330" y="70">+<animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/></text>
    <text x="300" y="250">*<animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" repeatCount="indefinite"/></text>
    <text x="40" y="240">+<animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></text>
    <text x="370" y="150">.<animate attributeName="opacity" values="0.1;1;0.1" dur="1.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- floating ASCII cloud -->
  <g font-family="Courier New, monospace" font-size="17" fill="#e8f6ff" xml:space="preserve" style="white-space:pre">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="4s" repeatCount="indefinite"/>
    <text x="60" y="105">        _.-~~~~~~-._</text>
    <text x="60" y="130">    .-~(            )~-._</text>
    <text x="60" y="155">   (   SALESFORCE  DEV    )</text>
    <text x="60" y="180">    `~-._            _.-~'</text>
    <text x="60" y="205">         `~-.____.-~'</text>
    <text x="60" y="235" fill="#00a1e0" font-size="14">     &lt;/&gt; Apex | LWC | SOQL</text>
  </g>

  <!-- typed terminal output -->
  <g font-family="Courier New, monospace" font-size="15" xml:space="preserve" style="white-space:pre">
    <g clip-path="url(#c1)"><text x="410" y="104" fill="#27c93f">$ sf org display --json</text></g>
    <g clip-path="url(#c2)"><text x="410" y="134" fill="#e8f6ff">&gt; Connected to org   [OK]</text></g>
    <g clip-path="url(#c3)"><text x="410" y="164" fill="#e8f6ff">&gt; Deploying LWC components...</text></g>
    <g clip-path="url(#c4)"><text x="410" y="194" fill="#e8f6ff">&gt; Apex tests: 100% pass</text></g>
    <g clip-path="url(#c5)"><text x="410" y="224" fill="#ffd166">&gt; Ready to build something great</text></g>
    <rect x="410" y="244" width="9" height="16" fill="#00a1e0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
